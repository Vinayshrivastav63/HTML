<!DOCTYPE html>
<html>
<head>
    <title>Image Resize and Position</title>
    <style>
        .image-container {
            width: 300px;
          
            height: 200px;
           
            position: relative;
            border: 30px solid rgb(19, 211, 19);
        }

        .image-container img{
            max-width: 100%;
            height: auto;
            position: relative;
            top: 5%;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src = "sky.jpg" alt="Resized and Positioned Image">
    </div>
</body>
</html>
