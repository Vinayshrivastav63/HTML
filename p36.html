<!DOCTYPE html>
<html>
<head>
    <title>CSS Table: Styling Even and Odd Cells</title>

    <style>
        tr:nth-child(odd) {
            background-color: white;
        }
        tr:nth-child(even) {
            background-color: rgb(215, 228, 25);
        }

        tr:nth-child(even) td:nth-child(even) {
            color: red;
            font-weight: bold;
        }
        tr:nth-child(odd) td:nthchild(odd) {
            color: green;
            font-style:italic;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>Row 1, Cell 1</td>
            <td>Row 1, Cell 2</td>
        </tr>
        <tr>
            <td>Row 2, Cell 1</td>
            <td>Row 2, Cell 2</td>
        </tr>
        <tr>
            <td>Row 3, Cell 1</td>
            <td>Row 3, Cell 2</td>
        </tr>
        
    </table>
</body>
</html>
