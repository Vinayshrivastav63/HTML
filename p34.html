<!DOCTYPE html>
<html>
<head>
   <title>Block Element Example</title>
   <style>
    .block-element {
        background-color: red;
        border: 50px solid blue;
        padding: 10px;

        display: block;
        width: 100%;
        box-sizing: border-box;
    }
   </style>
</head>
<body>
    <div class="block-element">
        This is a block-level element. It takes up the full width available within 
    </div>
</body>
</html>
