<!DOCTYPE html>
<html>
<head>
    <title>Form with Elements</title>
</head>
<body>
    <h1>Form with Elements</h1>
    <form>
        <label>
            <input type = "radio" name = "gender" value="male">Male
        </label>
        <label>
            <input type="radio" name="gender" value="female"> female
        </label>
        <label>
            <input type="radio" name="gender" value="other"> Other
        </label>
        <br>
        <br>
        <br>
        <br>

        <label>
            <input type="checkbox" name="interests" value="sports"> Sports
        </label>
        <label>
            <input type="checkbox" name="interests" value="music"> Music
        </label>
        <label>
            <input type="checkbox" name="interests" value="movies"> Movies
        </label>
        <label>
            <input type="checkbox" name="interests" value="dancing"> Dancing
        </label>
        
        <label for="password"> Password:</label>
        <input type = "password" id="password" name = "password">
        <br>

        <input type = "submit" value = "Submit">
    </form>
    <h2>Languages Known</h2>
    <form>
        <label>
            <input type="checkbox" name="interests" value="java"> Java
        </label>
        <label>
            <input type="checkbox" name="interests" value="python"> Python
        </label>
        <label>
            <input type="checkbox" name="interests" value="R"> R
        </label>
        <label>
            <input type="checkbox" name="interests" value="C++"> C++
        </label>
    </form>
</body>
</html>
